<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>موسوعة د. رشيد الجراح</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Readex+Pro:wght@300;400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
      // We keep the Tailwind setup here since it's injected before load
      tailwind = {
        config: {
          theme: {
            extend: {
              colors: {
                academic: {
                  bg: "var(--bg-color)",
                  text: "var(--text-color)",
                  primary: "var(--primary-color)",
                  card: "var(--card-bg)",
                  border: "var(--border-color)",
                  hover: "var(--hover-bg)",
                },
              },
              fontFamily: {
                readex: ['"Readex Pro"', "sans-serif"],
                amiri: ['"Amiri Quran"', "serif"],
                tajawal: ['"Tajawal"', "sans-serif"],
              },
            }
          }
        }
      }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root {
        --bg-color: #fdfbf7;
        --text-color: #1a202c;
        --primary-color: #0c4128;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --hover-bg: #f7fafc;
      }
      body {
        transition: background-color 0.4s ease, color 0.4s ease;
        font-family: "Readex Pro", sans-serif;
      }
      .quran-verse { 
          background-color: rgba(12, 65, 40, 0.05); 
          border-right: 4px solid var(--primary-color); 
          padding: 1rem; 
          border-radius: 0.5rem; 
          display: block; 
          margin: 2rem 0; 
          text-align: center; 
          font-size: 1.5em; 
          line-height: 2.5; 
          cursor: pointer; 
          transition: background-color 0.3s; 
      }
    </style>
</head>
<body class="bg-academic-bg text-academic-text antialiased min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
